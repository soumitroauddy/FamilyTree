# Default config targets Supabase / Railway production.
# Use the Supavisor pooler host (IPv4). db.<project>.supabase.co is IPv6-only and fails on Railway.
# Set these Railway service variables (or link Postgres so DATABASE_URL is set):
#   SUPABASE_JWT_SECRET, SPRING_DATASOURCE_PASSWORD (Supabase DB password)
#   APP_S3_ACCESS_KEY, APP_S3_SECRET_KEY
# Optional overrides: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, APP_S3_ENDPOINT
#
# Local Docker dev: SPRING_PROFILES_ACTIVE=local (see application-local.yml)

spring:
  application:
    name: user-management-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-west-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.obtctulilwkjxixizryr}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase ships a non-empty "public" schema (extensions, etc.) with no app tables.
    # baseline-version 0 ensures V1__init.sql still runs after baselining.
    baseline-on-migrate: true
    baseline-version: 0

app:
  supabase:
    jwt-secret: ${SUPABASE_JWT_SECRET}
  s3:
    endpoint: ${APP_S3_ENDPOINT:https://obtctulilwkjxixizryr.supabase.co/storage/v1/s3}
    access-key: ${APP_S3_ACCESS_KEY}
    secret-key: ${APP_S3_SECRET_KEY}
    bucket: ${APP_S3_BUCKET:family-tree-photos}
    region: ${APP_S3_REGION:us-east-1}
    presigned-url-expiry-minutes: ${APP_S3_PRESIGNED_URL_EXPIRY_MINUTES:60}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
