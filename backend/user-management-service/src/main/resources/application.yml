spring:
  application:
    name: user-management-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/familytree}
    username: ${SPRING_DATASOURCE_USERNAME:familytree}
    password: ${SPRING_DATASOURCE_PASSWORD:familytree}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  supabase:
    jwt-secret: ${SUPABASE_JWT_SECRET:dev-local}
  s3:
    endpoint: ${APP_S3_ENDPOINT:http://localhost:9000}
    access-key: ${APP_S3_ACCESS_KEY:familytree}
    secret-key: ${APP_S3_SECRET_KEY:familytree}
    bucket: ${APP_S3_BUCKET:family-tree-photos}
    region: ${APP_S3_REGION:us-east-1}
    presigned-url-expiry-minutes: ${APP_S3_PRESIGNED_URL_EXPIRY_MINUTES:60}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
