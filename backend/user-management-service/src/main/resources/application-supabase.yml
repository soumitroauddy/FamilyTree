# Supabase / Railway production profile
# Activated via SPRING_PROFILES_ACTIVE=supabase
# All values are injected from Railway environment variables.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.obtctulilwkjxixizryr.supabase.co:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

app:
  supabase:
    jwt-secret: ${SUPABASE_JWT_SECRET}
  s3:
    endpoint: ${APP_S3_ENDPOINT:https://obtctulilwkjxixizryr.supabase.co/storage/v1/s3}
    access-key: ${APP_S3_ACCESS_KEY}
    secret-key: ${APP_S3_SECRET_KEY}
    bucket: ${APP_S3_BUCKET:family-tree-photos}
    region: ${APP_S3_REGION:us-east-1}
    presigned-url-expiry-minutes: ${APP_S3_PRESIGNED_URL_EXPIRY_MINUTES:60}
