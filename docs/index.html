<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Tree App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:  #1b5e20;
      --green-mid:   #2e7d32;
      --green-light: #4caf50;
      --green-pale:  #e8f5e9;
      --text:        #212121;
      --muted:       #555;
      --border:      #c8e6c9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      background: var(--green-pale);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    .hero {
      text-align: center;
      max-width: 560px;
    }

    .hero .logo { font-size: 4rem; margin-bottom: 1rem; }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--green-dark);
      letter-spacing: -.5px;
    }

    .hero p {
      margin-top: .75rem;
      font-size: 1.05rem;
      color: var(--muted);
      line-height: 1.65;
    }

    .links {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: .9rem;
      justify-content: center;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .65rem 1.4rem;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .15s;
    }

    .links a:hover { opacity: .85; }

    .btn-primary {
      background: var(--green-mid);
      color: #fff;
      border: 2px solid var(--green-mid);
    }

    .btn-secondary {
      background: #fff;
      color: var(--green-dark);
      border: 2px solid var(--border);
    }

    footer {
      margin-top: 3rem;
      font-size: .82rem;
      color: var(--muted);
      text-align: center;
    }

    footer a { color: var(--green-mid); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="hero">
    <div class="logo">🌳</div>
    <h1>Family Tree</h1>
    <p>
      An interactive cross-platform app to build, share, and explore your
      family history — available on iOS, Android, macOS, and Web.
    </p>

    <div class="links">
      <a class="btn-primary"
         href="https://github.com/soumitroauddy/FamilyTree"
         target="_blank" rel="noopener">
        ⭐ View on GitHub
      </a>
      <a class="btn-secondary" href="privacy-policy.html">
        🔒 Privacy Policy
      </a>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Family Tree App</p>
  </footer>

</body>
</html>
